<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}GitHub AI Planner{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --accent: #58a6ff;
      --accent2: #1f6feb;
      --green: #3fb950;
      --orange: #d29922;
      --red: #f85149;
      --purple: #a371f7;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-user { display: flex; align-items: center; gap: 8px; }
    .nav-user img { width: 28px; height: 28px; border-radius: 50%; }
    .nav-user span { color: var(--text2); font-size: 13px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent2); color: #fff; }
    .btn-secondary {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .page-subtitle { color: var(--text2); font-size: 14px; margin-bottom: 24px; }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 6px;
    }
    .form-label .required { color: var(--red); margin-left: 2px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 80px; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-blue   { background: #1f3a5f; color: var(--accent); }
    .badge-green  { background: #1a3a2a; color: var(--green); }
    .badge-orange { background: #3a2a10; color: var(--orange); }
    .badge-red    { background: #3a1a1a; color: var(--red); }
    .badge-purple { background: #2a1a3a; color: var(--purple); }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 13px;
    }
    .alert-warning {
      background: #3a2a10;
      border: 1px solid var(--orange);
      color: var(--orange);
    }
    .alert-success {
      background: #1a3a2a;
      border: 1px solid var(--green);
      color: var(--green);
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .text-muted  { color: var(--text2); }
    .text-accent { color: var(--accent); }
    .mt-4  { margin-top: 16px; }
    .mb-4  { margin-bottom: 16px; }
    .flex  { display: flex; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .items-center    { align-items: center; }
    .justify-between { justify-content: space-between; }
    .hidden { display: none; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="nav-logo">GitHub <span>AI</span> Planner</a>
  <div class="nav-right">
    {% if user %}
      <a href="/plans/new/" class="btn btn-primary btn-sm">+ 새 플랜</a>
      <div class="nav-user">
        {% if user.avatar_url %}
          <img src="{{ user.avatar_url }}" alt="avatar"/>
        {% endif %}
        <span>{{ user.name|default:user.login }}</span>
      </div>
      <a href="/accounts/logout/" class="btn btn-secondary btn-sm">로그아웃</a>
    {% else %}
      <a href="/accounts/login/" class="btn btn-primary btn-sm">GitHub 로그인</a>
    {% endif %}
  </div>
</nav>


<main>
  {% block content %}{% endblock %}
</main>

{% block extra_js %}{% endblock %}
</body>
</html>
